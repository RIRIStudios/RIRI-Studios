<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you | RIRI Studios</title>
<link rel="icon" href="img/sk_logo.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@300;400&family=Mrs+Saint+Delafield&display=swap">
<style>
:root{--red:#a51d1b;--ink:#0c0a0a;--creme:#efe7da}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--red);color:var(--creme);font:300 17px/1.65 "Jost",system-ui,sans-serif;display:grid;place-items:center;padding:40px 20px}
main{max-width:560px;text-align:center}
.word{font:400 22px "Bodoni Moda",Georgia,serif;letter-spacing:.32em;text-transform:uppercase;text-decoration:none;color:var(--creme)}
h1{font:400 clamp(44px,8vw,72px)/1 "Bodoni Moda",Georgia,serif;margin:48px 0 8px}
h1 i{color:var(--ink)}
.sig{font:400 64px/1 "Mrs Saint Delafield",cursive;color:var(--ink);margin:6px 0 24px}
p{color:#f6d2cc;margin:0 0 14px}
p a{color:var(--creme)}
a.btn{display:inline-block;margin-top:24px;background:var(--ink);color:var(--creme);text-decoration:none;padding:16px 30px;font:400 12px "Jost",sans-serif;letter-spacing:.22em;text-transform:uppercase}
img{width:110px;margin-top:36px;filter:drop-shadow(0 10px 14px #0007);transform:rotate(-8deg)}
</style>
</head>
<body>
<main>
  <a class="word" href="/">Riri Studios</a>
  <h1>Thank <i>you.</i></h1>
  <div class="sig">xo, Riri</div>
  <p>Your order is in. A receipt is on its way to your email.</p>
  <p>Every order is packed by hand. Prints ship within 3 to 5 business days; framed prints and hoodies take a little longer.</p>
  <p>Questions? Email <a href="mailto:Arianna@riristudios.com">Arianna@riristudios.com</a>.</p>
  <a class="btn" href="/">Back to the shop</a>
  <br><img src="img/sk_heart.webp" alt="">
</main>
<script>try{localStorage.removeItem("riri_bag")}catch(e){}</script>
</body>
</html>
